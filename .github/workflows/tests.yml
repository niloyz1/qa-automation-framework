name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly full regression, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the Allure report to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.17.5
      - run: ruff check . && ruff format --check .

  smoke:
    name: Smoke (web, API, LLM)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run smoke suite
        run: pytest -m "smoke and not mobile" -n auto --reruns 1 --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-smoke
          path: reports/allure-results
          retention-days: 7

  regression:
    name: Regression (${{ matrix.browser }})
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run regression suite
        # API and LLM suites don't depend on the browser, so run them once (on chromium).
        run: |
          MARKERS="regression and not mobile"
          if [ "${{ matrix.browser }}" != "chromium" ]; then MARKERS="regression and web"; fi
          pytest -m "$MARKERS" --browser ${{ matrix.browser }} -n auto --reruns 1 \
            --tracing retain-on-failure --video retain-on-failure --output test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  report:
    name: Publish Allure report
    needs: [smoke, regression]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Load report history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Build report (keeps trend history from previous runs)
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi
          cat > allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "buildName": "Run #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportName": "QA Automation Framework"}
          EOF
          npx --yes allure-commandline@2.46.1 generate allure-results --clean -o allure-report
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
